name: pypi

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      # trusted publishing: PyPI accepts a token from GitHub for this workflow
      id-token: write

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'
    - name: Build
      run: |
        python -m pip install --upgrade pip flit
        flit build
    - name: Publish
      uses: pypa/gh-action-pypi-publish@release/v1
