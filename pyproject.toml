[build-system]
requires = ["flit_core >=2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "topojson"
requires-python = ">=3.11"
dynamic = ["version", "description"]
authors = [
    {name = "Mattijn van Hoek", email = "mattijn@gmail.com"},
]
dependencies = ["numpy", "shapely>=2.1"]
keywords = ["topojson", "python", "github", "topology", "geojson"]
readme = "README.md"
classifiers = ["License :: OSI Approved :: BSD License"]


[project.optional-dependencies]
dev = [    
    "geopandas", 
    "fiona",
    "geojson", 
    "simplification", 
    "pyshp", 
    "altair", 
    "ipywidgets"    
]

[project.urls]
Documentation = "https://mattijn.github.io/topojson"
Source = "https://github.com/mattijn/topojson"
Releases = "https://github.com/mattijn/topojson/releases"

[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = ["*.ipynb", "docs"]  # docs: hand-written examples and generated pages

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "W",
    "F",    # pyflakes
    "I",    # import order
    "B",    # bugbear
    "UP",   # pyupgrade
    "SIM",  # simplify
    "C4",   # comprehensions
    "C90",  # complexity
    "PIE",
    "LOG",  # logging
    "RUF",
]
ignore = [
    "E501",  # long lines are left to the formatter; strings and comments may run over
    "B905",  # zips run over parallel arrays of the same length
]

[tool.ruff.lint.mccabe]
max-complexity = 20

[tool.mypy]
python_version = "3.11"
# shapely, geopandas and the optional packages come without type information
ignore_missing_imports = true
# a needless "type: ignore" is an error, so tests/typing_api.py can mark wrong calls
warn_unused_ignores = true

# the public API is typed strictly, the other modules step by step

[[tool.mypy.overrides]]
module = ["topojson.core.topology", "topojson._types"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
